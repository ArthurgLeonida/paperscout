[project]
name = "paperscout"
version = "0.1.0"
description = "Research-paper discovery and reading-priority assistant built on the official Semantic Scholar APIs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.6,<3",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]

[project.scripts]
paperscout = "paperscout.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paperscout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
