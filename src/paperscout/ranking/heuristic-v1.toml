# Transparent, versioned heuristic ranking configuration.
# Scores are ordering heuristics, NOT probabilities or quality measures.
# Change the version string whenever weights or thresholds change so stored
# runs remain interpretable.
version = "heuristic-v1"

[weights]
# Missing (unknown) components are dropped and the remaining weights renormalised;
# the assessment then lists the missing component as an uncertainty.
topic_relevance = 0.40
project_usefulness = 0.30
seed_affinity = 0.15
recency = 0.15          # multiplied by the recency-preference factor below

[recency_preference_factor]
strong = 1.0
moderate = 0.5
none = 0.0

[recency_half_life_days]
strong = 180
moderate = 540
none = 1095

[priority_thresholds]   # heuristic_score cut-offs
P1 = 0.55
P2 = 0.35
P3 = 0.20

[band_thresholds]       # component value -> high/medium/low
high = 0.60
medium = 0.30

[penalties]
exclusion_hit = 0.5     # multiplier when an exclusion criterion matches
negative_seed = 0.6     # multiplier when closer to a negative seed than to positive seeds

[profile_match]
# Fraction of topic terms that must appear in the profile text before the
# profile is used to judge project usefulness for an ad-hoc topic.
min_topic_overlap = 0.25

[roles]
foundational_min_age_years = 3
foundational_min_citations = 200   # used only to label the role, never to rank
recent_method_max_age_days = 548

[effort_minutes]        # planning heuristics, not predictions
overview = [20, 40]
survey_overview = [40, 75]
substantive = [90, 150]
deep = [240, 420]
note_buffer_fraction = 0.15

[synonyms]
# Editable, field-agnostic mechanism; these entries are only examples.
"3dgs" = ["gaussian splatting"]
"nerf" = ["neural radiance field"]
"ldm" = ["latent diffusion"]
"vlm" = ["vision language model"]
"llm" = ["large language model"]
